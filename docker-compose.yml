services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: autolead_db
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d autolead_db" ]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"

  redis:
    image: redis:7-alpine
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 12
    ports:
      - "6381:6379"

  evolution-api:
    image: evoapicloud/evolution-api:latest
    restart: always
    environment:
      - SERVER_PORT=8080
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY:-supersecretkey}
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://postgres:password@db:5432/autolead_db
      - DATABASE_CONNECTION_CLIENT_NAME=evolution
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://redis:6379/1
    ports:
      - "8081:8080"
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  backend:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/autolead_db
      - REDIS_URL=redis://redis:6379/0
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - POSTMARK_API_KEY=${POSTMARK_API_KEY}
      - POSTMARK_SENDER=${POSTMARK_SENDER}
      - MAILTRAP_API_TOKEN=${MAILTRAP_API_TOKEN}
      - ZOHO_SMTP_HOST=${ZOHO_SMTP_HOST}
      - ZOHO_SMTP_PORT=${ZOHO_SMTP_PORT}
      - ZOHO_SMTP_USER=${ZOHO_SMTP_USER}
      - ZOHO_SMTP_PASSWORD=${ZOHO_SMTP_PASSWORD}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    command: npm run dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - NEXT_PUBLIC_API_URL=http://16.192.151.211.nip.io:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  evolution_instances:
